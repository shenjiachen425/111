<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收银端口 · 优惠券核销</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f4f6fb; color: #1f2a44; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: #2d3e63; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 10px; }
  header .back { color: #fff; text-decoration: none; opacity: .85; font-size: 13px; margin-left: auto; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff6b35; }
  header .who { margin-left: auto; font-size: 13px; opacity: .85; }
  .wrap { max-width: 560px; margin: 22px auto; padding: 0 16px; width: 100%; }
  .panel { background: #fff; border: 1px solid #e3e8f2; border-radius: 16px; padding: 22px; box-shadow: 0 4px 16px rgba(0,0,0,.05); }
  label { display: block; font-size: 13px; color: #6b7794; margin-bottom: 6px; }
  input { width: 100%; border: 1px solid #d6deec; border-radius: 12px; padding: 12px 14px;
          font-size: 14px; outline: none; font-family: inherit; }
  .row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
  .row > div { flex: 1; }
  .card { border-radius: 14px; padding: 20px; }
  .card.ok   { background: #e9f9f0; border: 1px solid #8bd9aa; }
  .card.no   { background: #fdecec; border: 1px solid #f0a3a3; }
  .card.wait { background: #fff4e5; border: 1px solid #f3c47a; }
  .verdict { font-size: 20px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card.ok .verdict   { color: #1a9e54; }
  .card.no .verdict   { color: #d23b3b; }
  .card.wait .verdict { color: #c9821a; }
  .amounts { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; }
  .old { color: #8a93a8; text-decoration: line-through; font-size: 15px; }
  .new { color: #1a9e54; font-size: 30px; font-weight: 800; }
  .meta { font-size: 13px; color: #4a5572; line-height: 1.7; }
  .meta .k { color: #6b7794; }
  .src { margin-top: 12px; font-size: 12px; color: #6b7794; border-top: 1px dashed #cdd6e6; padding-top: 8px; }
  .trace { margin-top: 8px; font-size: 11px; color: #9aa6c4; }
  #rcode { margin-bottom: 16px; letter-spacing: 1px; text-transform: uppercase; }
  #redeem { width: 100%; background: #2d3e63; color: #fff; border: none; border-radius: 12px; padding: 13px; font-size: 15px; cursor: pointer; font-weight: 600; }
  #redeem:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <span>🧾 收银端口 · 优惠券核销</span>
  <span id="who" class="who"></span>
  <a class="back" href="#" id="logout">退出</a>
</header>
<div style="max-width:560px;margin:6px auto 0;padding:0 16px;font-size:12px;color:#9aa6c4">本结果为辅助信息，最终以门店/运营口径为准</div>
<div class="wrap">
  <div class="panel">
    <label>券核销（会员端「使用」后生成的核销码）</label>
    <input id="rcode" placeholder="输入核销码，如 123456">
    <div class="row">
      <div>
        <label>订单当前金额（元）</label>
        <input id="ramount" type="number" step="0.01" placeholder="如 268.00">
      </div>
    </div>
    <button id="redeem">确认核销</button>
    <div id="rresult"></div>
  </div>
</div>

<script>
const TOKEN = localStorage.getItem("sg_token");
if(!TOKEN){ location.href = "/login"; }

// 登录态校验：本地解析 JWT 校验过期（不依赖 /me）
(function(){
  function parseJwt(t){ try{ return JSON.parse(atob(t.split('.')[1])); }catch(e){ return null; } }
  const p = parseJwt(TOKEN);
  if(!p || (p.exp && p.exp*1000 < Date.now())){ localStorage.clear(); location.href = "/login"; return; }
  document.getElementById("who").textContent = (localStorage.getItem("sg_name")||p.username) + "（收银）";
})();

document.getElementById("logout").onclick = async (e)=>{
  e.preventDefault();
  await fetch("/logout", {method:"POST", headers:{"Content-Type":"application/json", "X-Token": TOKEN}, body: JSON.stringify({token: TOKEN})}).catch(()=>{});
  localStorage.clear(); location.href = "/login";
};

// ===== 手动输入核销码 + 订单金额，计算应付 =====
document.getElementById("redeem").onclick = async ()=>{
  const code = document.getElementById("rcode").value.trim();
  const a = parseFloat(document.getElementById("ramount").value);
  if(!code){ alert("请输入核销码"); return; }
  if(isNaN(a)){ alert("请输入有效的订单金额"); return; }
  const btn = document.getElementById("redeem"); btn.disabled = true; btn.textContent = "核销中…";
  try{
    const res = await fetch("/cashier/redeem", {
      method:"POST", headers:{"Content-Type":"application/json", "X-Token":TOKEN},
      body: JSON.stringify({code, order_amount:a, token:TOKEN})
    });
    const r = await res.json();
    const box = document.getElementById("rresult"); box.style.display = "block";
    if(res.status === 404){
      box.innerHTML = `<div class="card no"><div class="verdict">⛔ 核销失败</div><div class="meta">${r.message}</div></div>`;
    } else if(res.status === 409){
      box.innerHTML = `<div class="card no"><div class="verdict">⛔ 已核销</div><div class="meta">${r.message}（${r.coupon_name||""}）</div></div>`;
    } else if(res.ok && r.ok){
      const newAmt = Number(r.new_amount).toFixed(2);
      const oldAmt = Number(r.order_amount).toFixed(2);
      let extra = `<span class="k">核销码：</span>${r.code}<br><span class="k">说明：</span>${r.reason}`;
      if(r.rule_version) extra += `<br><span class="k">依据版本：</span>${r.rule_version}`;
      if(r.biz_id) extra += `<br><span class="k">业务编号：</span>${r.biz_id}`;
      if(r.escalate && r.note){
        extra += `<div class="card wait" style="margin-top:8px;padding:10px 12px"><div class="verdict" style="font-size:15px">⚠️ 待人工确认</div>`
          + `<div class="meta" style="color:#c9821a"><span class="k">触发原因：</span>${r.reason||""}<br>`
          + `<span class="k">建议接手人：</span>${r.handler||""}<br>`
          + `<span class="k">说明：</span>${r.note}</div></div>`;
      }
      box.innerHTML = `<div class="card ok"><div class="verdict">✅ 核销成功${r.exchange?"（赠品券）":""}</div>
        <div class="amounts"><span class="old">¥${oldAmt}</span><span class="new">¥${newAmt}</span></div>
        <div class="meta"><span class="k">券：</span>${r.coupon_name}（${r.coupon_type}）<br>${extra}</div></div>`;
    } else {
      box.innerHTML = `<div class="card no"><div class="verdict">⛔ 不可用</div><div class="meta">${r.message||"该订单不满足使用条件"}</div></div>`;
    }
  }catch(e){
    document.getElementById("rresult").style.display="block";
    document.getElementById("rresult").innerHTML = `<div class="card no"><div class="verdict">⚠️ 失败</div><div class="meta">网络异常，请重试。</div></div>`;
  }finally{ btn.disabled = false; btn.textContent = "确认核销"; }
};
</script>
</body>
</html>
